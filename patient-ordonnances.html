<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Net Sourire | Mes ordonnances</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="patient.css">
<link rel="stylesheet" href="patient-dashboard.css">
</head>

<body>
  <div class="patient-dashboard">
    <aside class="patient-sidebar">
      <div class="sidebar-header">
        <img src="images/logo.png" class="sidebar-logo" alt="Net Sourire">
        <h2>NET SOURIRE</h2>
        <p>Espace Patient</p>
      </div>
      <ul class="sidebar-menu">
        <li><a href="patient-dashboard.html"><i class="fa-solid fa-house"></i> Tableau de bord</a></li>
        <li><a href="patient-rendezvous.html"><i class="fa-solid fa-calendar-check"></i> Mes rendez-vous</a></li>
        <li class="active"><a href="patient-ordonnances.html"><i class="fa-solid fa-file-prescription"></i> Mes ordonnances</a></li>
        <li><a href="patient-factures.html"><i class="fa-solid fa-file-invoice-dollar"></i> Mes factures</a></li>
        <li><a href="patient-profil.html"><i class="fa-solid fa-user"></i> Mon profil</a></li>
        <li><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a></li>
      </ul>
    </aside>

    <main class="patient-main">
      <header class="patient-header">
        <h1><i class="fa-solid fa-file-prescription"></i> Mes ordonnances</h1>
      </header>

      <section class="patient-section">
        <div id="ordonnancesList" class="cards-container">
          <p>Chargement de vos ordonnances...</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const listEl = document.getElementById("ordonnancesList");
    const logoutBtn = document.getElementById("logoutBtn");

    if (logoutBtn) {
      logoutBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        await signOut(auth);
        localStorage.clear();
        window.location.href = "patient-login.html";
      });
    }

    const escapeHtml = (v) => String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "patient-login.html";
        return;
      }

      try {
        // Nom du patient pour correspondance (documents admin sans patientId)
        const pDoc = await getDoc(doc(db, "patients", user.uid));
        const nomPatient = pDoc.exists() ? (pDoc.data().nom || "") : "";

        let docs = [];
        try {
          const q = query(collection(db, "ordonnances"), where("patientId", "==", user.uid));
          const snap = await getDocs(q);
          docs = snap.docs.map((d) => ({ id: d.id, data: d.data() }));
        } catch (err) {
          console.error(err);
        }

        if (nomPatient) {
          const tout = await getDocs(collection(db, "ordonnances"));
          tout.docs.forEach((d) => {
            const data = d.data();
            if (data.patientId !== user.uid) {
              const nomDoc = data.patientNom || data.patient;
              if (typeof nomDoc === "string" &&
                  nomDoc.trim().toLowerCase() === nomPatient.trim().toLowerCase()) {
                docs.push({ id: d.id, data });
              }
            }
          });
        }

        if (docs.length === 0) {
          listEl.innerHTML = "<p>Aucune ordonnance disponible pour le moment.</p>";
          return;
        }

        listEl.innerHTML = "";
        docs.forEach((item) => {
          const data = item.data;
          const card = document.createElement("div");
          card.className = "patient-card";
          card.innerHTML = `
            <h3>Ordonnance du ${escapeHtml(data.date || "N/A")}</h3>
            <p><strong>Médecin :</strong> ${escapeHtml(data.medecin || "Cabinet Net Sourire")}</p>
            <p><strong>Prescription :</strong> ${escapeHtml(data.medicaments || data.contenu || data.prescription || "Voir détails au cabinet")}</p>
          `;
          listEl.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        listEl.innerHTML = "<p>Impossible de charger les ordonnances.</p>";
      }
    });
  </script>
</body>

</html>
