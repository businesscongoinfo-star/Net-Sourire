<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Net Sourire | Mes Rendez-vous</title>

<link rel="icon" href="images/logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="patient.css">
<link rel="stylesheet" href="patient-dashboard.css">

</head>

<body>

<div class="patient-dashboard">

<!-- ==========================
SIDEBAR
========================== -->

<aside class="patient-sidebar">

<div class="sidebar-header">

<img
src="images/logo.png"
class="sidebar-logo"
alt="Net Sourire">

<h2>

NET SOURIRE

</h2>

<p>

Espace Patient

</p>

</div>

<ul class="sidebar-menu">

<li>

<a href="patient-dashboard.html">

<i class="fa-solid fa-house"></i>

Tableau de bord

</a>

</li>

<li class="active">

<a href="patient-rendezvous.html">

<i class="fa-solid fa-calendar-check"></i>

Mes Rendez-vous

</a>

</li>

<li>

<a href="patient-ordonnances.html">

<i class="fa-solid fa-file-prescription"></i>

Mes Ordonnances

</a>

</li>

<li>

<a href="patient-factures.html">

<i class="fa-solid fa-file-invoice-dollar"></i>

Mes Factures

</a>

</li>

<li>

<a href="patient-profil.html">

<i class="fa-solid fa-user"></i>

Mon Profil

</a>

</li>

<li>

<a href="#"

onclick="deconnexionPatient()">

<i class="fa-solid fa-right-from-bracket"></i>

Déconnexion

</a>

</li>

</ul>

</aside>

<!-- ==========================
CONTENU
========================== -->

<main class="patient-main">

<header class="patient-topbar">

<div>

<h1>

Mes Rendez-vous

</h1>

<p>

Consultez et gérez tous vos rendez-vous.

</p>

</div>

<button

id="btnNouveauRdv"

class="btn-primary">

<i class="fa-solid fa-calendar-plus"></i>

Demander un rendez-vous

</button>

</header>

<section class="dashboard-box">

<div class="box-header">

<div class="search-box">

<i class="fa-solid fa-search"></i>

<input

type="text"

id="rechercheRdv"

placeholder="Rechercher un rendez-vous...">

</div>
<div class="table-responsive">

<table class="table">

<thead>

<tr>

<th>Date</th>

<th>Heure</th>

<th>Dentiste</th>

<th>Motif</th>

<th>Statut</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="rendezvousTable">

<!-- Chargé automatiquement par patient-rendezvous.js -->

</tbody>

</table>

</div>

</section>

<!-- ==========================
NOUVEAU RENDEZ-VOUS
========================== -->

<div id="rendezvousModal" class="modal">

<div class="modal-content modal-large">

<div class="modal-header">

<h2>

<i class="fa-solid fa-calendar-plus"></i>

Demander un rendez-vous

</h2>

<span

class="close"

id="closeModal">

&times;

</span>

</div>

<form id="rendezvousForm">

<div class="form-grid">

<div class="form-group">

<label>Date souhaitée</label>

<input

type="date"

id="date"

required>

</div>

<div class="form-group">

<label>Heure souhaitée</label>

<input

type="time"

id="heure"

required>

</div>

<div class="form-group">

<label>Dentiste souhaité</label>

<select id="dentiste">

<option value="">Premier dentiste disponible</option>

<option>Dr Mavoungou</option>

<option>Dr Ngoma</option>

<option>Dr Mbemba</option>

</select>

</div>

<div class="form-group">

<label>Type de consultation</label>

<select id="typeConsultation">

<option>Consultation</option>

<option>Détartrage</option>

<option>Soin dentaire</option>

<option>Extraction</option>

<option>Implant</option>

<option>Orthodontie</option>

<option>Urgence</option>

</select>

</div>

<div class="form-group full-width">

<label>Motif du rendez-vous</label>

<textarea

id="motif"

rows="4"

placeholder="Décrivez votre demande...">

</textarea>

</div>
<div class="modal-footer">

<button

type="button"

class="btn btn-secondary"

id="annulerRendezvous">

Annuler

</button>

<button

type="submit"

class="btn btn-primary">

<i class="fa-solid fa-paper-plane"></i>

Envoyer la demande

</button>

</div>

</form>

</div>

</div>

<!-- ==========================
DETAILS RENDEZ-VOUS
========================== -->

<div id="rendezvousDetails" class="modal">

<div class="modal-content modal-large">

<div class="modal-header">

<h2>

<i class="fa-solid fa-calendar-check"></i>

Détails du Rendez-vous

</h2>

<span

class="close"

id="closeDetails">

&times;

</span>

</div>

<div id="rendezvousInfo">

<!-- Chargé automatiquement par patient-rendezvous.js -->

</div>

</div>

</div>

</main>

</div>

<script type="module" src="firebase.js"></script>

<script type="module" src="patient-auth.js"></script>

<script type="module" src="patient-rendezvous.js"></script>

</body>

</html>
