<!-- ===== CONTENU ===== -->

<main class="main-content">

<header class="topbar">

<div>

<h1>

Paramètres du Cabinet

</h1>

<p>

Configurez les informations générales de votre cabinet dentaire.

</p>

</div>

<button

id="btnEnregistrerParametres"

class="btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer

</button>

</header>

<section class="dashboard-box">

<form id="parametresForm">

<div class="form-grid">

<div class="form-group">

<label>Nom du cabinet</label>

<input

type="text"

id="nomCabinet"

placeholder="Cabinet Net Sourire">

</div>

<div class="form-group">

<label>Nom du responsable</label>

<input

type="text"

id="responsable">

</div>

<div class="form-group">

<label>Téléphone</label>

<input

type="tel"

id="telephoneCabinet">

</div>

<div class="form-group">

<label>Email</label>

<input

type="email"

id="emailCabinet">

</div>

<div class="form-group full-width">

<label>Adresse</label>

<input

type="text"

id="adresseCabinet">

</div>
<div class="form-group">

<label>Ville</label>

<input

type="text"

id="villeCabinet"

placeholder="Pointe-Noire">

</div>

<div class="form-group">

<label>Pays</label>

<input

type="text"

id="paysCabinet"

placeholder="République du Congo">

</div>

<div class="form-group">

<label>Devise</label>

<select id="devise">

<option value="FCFA">FCFA</option>

<option value="USD">USD</option>

<option value="EUR">EUR</option>

</select>

</div>

<div class="form-group">

<label>Logo du cabinet</label>

<input

type="file"

id="logoCabinet"

accept="image/*">

</div>

<div class="form-group full-width">

<label>Description</label>

<textarea

id="descriptionCabinet"

rows="4"

placeholder="Description du cabinet...">

</textarea>

</div>

<div class="form-group full-width">

<label>Horaires d'ouverture</label>

<textarea

id="horaires"

rows="4"

placeholder="Lundi - Vendredi : 08h00 - 18h00&#10;Samedi : 08h00 - 13h00">

</textarea>

</div>

<div class="form-group full-width">

<label>Conditions générales</label>

<textarea

id="conditions"

rows="5"

placeholder="Conditions générales du cabinet...">

</textarea>

</div>

</div>

<div class="modal-footer">

<button

type="reset"

class="btn btn-secondary">

Réinitialiser

</button>

<button

type="submit"

class="btn btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer les paramètres

</button>

</div>

</form>

</section>

</main>

</div>

<script type="module" src="firebase.js"></script>

<script type="module" src="auth.js"></script>

<script type="module" src="parametres.js"></script>
